
mcp:
  enabled: true
  tool_discovery: off

  servers:
    filesystem:
      transport: stdio
      command: cmd
      args:
        - /d
        - /c
        - npx
        - -y
        - "@modelcontextprotocol/server-filesystem@2.4.0"
        # BMAD clone: readable by agents, but the server itself refuses any write into it
        - --read-only-dir
        - 'C:\Projects\NTG\Agents\Planner_Agent\Plugins'
        - 'C:\Projects\NTG'
      tool_timeout: 60s
      allowed_tools:
        # read
        - list_allowed_directories
        - list_directory
        - list_directory_with_sizes
        - directory_tree
        - search_files
        - get_file_info
        - read_text_file
        - read_multiple_files
        # write (used by the BMAD adapter's write_file / append_file / edit_file / … tools)
        - write_file
        - append_file
        - edit_file
        - create_directory
        - move_file
        - copy_file

    github:
      transport: http
      url: https://api.githubcopilot.com/mcp/readonly
      headers:
        Authorization: "Bearer ${GITHUB_PAT}"
        X-MCP-Toolsets: "repos,issues"
      allowed_tools:
        - get_file_contents
        - search_repositories
        - search_code
        - list_commits
        - list_branches
        - list_issues
        - issue_read
      tool_timeout: 60s

    context7:
      transport: stdio
      command: cmd
      args:
        - /d
        - /c
        - npx
        - -y
        - "@upstash/context7-mcp@latest"
      tool_timeout: 60s
      allowed_tools:
        - resolve-library-id
        - query-docs

    duckduckgo:
      transport: stdio
      command: uvx
      env:
        TEMP: '${TEMP}'
        TMP: '${TMP}'
        LOCALAPPDATA: '${LOCALAPPDATA}'
        APPDATA: '${APPDATA}'
        USERPROFILE: '${USERPROFILE}'
      args:
        - --with
        - 'duckduckgo-mcp-server[browser]'
        - duckduckgo-mcp-server
        - --ref-url-threshold
        - '0'
      tool_timeout: 60s
      allowed_tools:
        - search

    crawl4ai:
      transport: stdio
      command: uvx
      env:
        TEMP: '${TEMP}'
        TMP: '${TMP}'
        LOCALAPPDATA: '${LOCALAPPDATA}'
        APPDATA: '${APPDATA}'
        USERPROFILE: '${USERPROFILE}'
      args:
        - --python
        - '3.12'
        - --from
        - https://github.com/potterdigital/crawl4ai-mcp/archive/refs/heads/main.zip
        - crawl4ai-mcp
      tool_timeout: 120s
      allowed_tools:
        - ping
        - crawl_url

    research-rabbit:
      transport: stdio
      command: cmd
      args:
        - /d
        - /c
        - npx
        - --yes
        - --package=@gonzih/research-rabbit@0.1.0
        - --
        - research-rabbit
      tool_timeout: 90s
      allowed_tools:
        - search_papers
        - format_citation
