researcher:
  model: router
  gateway_url: http://localhost:8080
  output_dir: research_output
  formats: [markdown, json]
  concurrency: 4
  timeout: 70
  attempts: 2
  citation_attempts: 2
  max_questions: 6
  content_limit: 12000
  minimum_evidence: 1
  sourcegraph: false
  exa: false
  routes:
    web: [duckduckgo, crawl4ai]
    documentation: [context7, fetch]
    repository: [github, sourcegraph]
    library: [deps_dev]
    academic: [research-rabbit]
    api: [swagger_parser]
  endpoints:
    pypi: https://pypi.org/pypi
    npm: https://registry.npmjs.org
    deps_dev: https://api.deps.dev/v3/systems
    sourcegraph: https://sourcegraph.com/.api/search/stream
    exa: https://api.exa.ai/search
  skills:
    duckduckgo: mcp-duckgo
    crawl4ai: crawl4ai
